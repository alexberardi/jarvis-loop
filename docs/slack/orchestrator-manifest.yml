# The @orchestrator Slack app (phase 8, docs/phases/08-orchestrator.md). Created once by the user:
# api.slack.com/apps → Create New App → From a manifest → this file → Install to Workspace.
# Then: Basic Information → App-Level Tokens → Generate (scope connections:write) = the xapp
# token; OAuth & Permissions → Bot User OAuth Token = the xoxb token. Both go in
# ~/.config/jarvis-harness/orchestrator-slack.env (0600):
#   SLACK_BOT_TOKEN=xoxb-...
#   SLACK_APP_TOKEN=xapp-...
# loopd keeps one Socket Mode connection per app; never run a second loopd with this file.
display_information:
  name: Orchestrator
  description: Keeps the Jarvis Loop moving; ping it to ask or to act.
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: orchestrator
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - im:history
      - im:read
      - im:write
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
