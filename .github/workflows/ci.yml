name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs: a merge right after another must not cancel main's run on the first merge commit,
  # which the land stage watches (a cancelled run is no proof the commit is green).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # The race tests plus the scenarios take about 9 minutes; at 10, a slow runner cancelled most PR
    # runs and every one came back to the loop as a CI failure (#212). Raised again with the test
    # timeout below (#548), so a 20-minute test binary still has room for the scenarios after it.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: bubblewrap (the runner fences setup and verify commands with it)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-pid --proc /proc -- true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      - name: vet (linux, darwin; CGO off)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...
      - name: test (race)
        env:
          CGO_ENABLED: "1"
        # Under the job's cap, so a hung test prints its goroutines instead of the job being cut off.
        # The timeout is per test binary, and internal/runner has outgrown 12m on a 2-vCPU runner
        # while the other heavy packages run beside it: at the cap it was 6 of its 289 tests from
        # the end (#548). 20m is the same kind of headroom 12m had when the whole suite took 7m.
        run: go test -race -timeout 20m ./...
      - name: build (CGO off)
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: loop harness scenarios (fake Slack, fake claude, fake GitHub)
        run: scripts/loop-sandbox run --name ci
      - name: scenario transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-sandbox-run
          path: .sandbox/ci/runs/latest/*/transcript.md
          if-no-files-found: ignore
  # The Mac runners' fence (sandbox-exec, docs/decisions/2026-10-17-mac-runners.md) on real macOS.
  fence-macos:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: sandbox-exec
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)' true
      - name: fence tests
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/runner/ -run 'TestFence|TestSBPL|TestDefaultVerify'
      - name: build loop-runner (darwin/arm64)
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/loop-runner
